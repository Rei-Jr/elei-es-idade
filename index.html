<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Voto de eleições</title>
    <style>
        body{
            text-align: center;
            padding: 2px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            background-color: rgb(194, 189, 183);

        }

        .titulo{
            padding: 20vh;
            background-color: bisque;
            border-radius: 10px;
            padding: 20vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
           
        }
        .titulo h1{
            color: rgb(238, 80, 80);

        }

        .ver p{
            color: blueviolet;
        }

        #res{
            
            background-color: rgb(241, 54, 54);
            color: antiquewhite;
            margin-top: 10px;
            border-radius: 100px;
            padding: 10px 20px;
            width: fit-content;
           
        }

        input#idade{
            background-color: rgb(227, 225, 240);
            border-radius: 10px;
            
        }
        input[type="button"]{
            background-color: rgb(60, 63, 68);
            color: antiquewhite;
            margin: 10px;
            border-radius: 22px;
            
        }
    </style>
</head>
<body>
    <div class="titulo">
    <div class="eleicoes">
        <h1>Eleições</h1>
        <div class="ver"> 
       <p> Verifique se você pode votar.</p>

       <p>Digite sua idade </p>
        
        </div>
    </div>
    
<input type="number" name="ida" id="idade">
<input type="button" value="ver" onclick="ver()">

<div id="res"></div>
</div>


<script>
    function ver(){
        var ida = document.querySelector('input#idade')
        var res = document.querySelector('#res')

        var idade = Number(ida.value)

        if(idade < 16){
            res.innerHTML = `Você não pode votar`
        } else{
            if (idade < 18 || idade > 65){
                res.innerHTML= `Você decide se quer votar <strong>SIM</strong> ou <strong>NÃO</strong>`
            } else{
                res.innerHTML = `Você é obrigatorio a votar`
            }
        }

    }
</script>
</body>

</html>
